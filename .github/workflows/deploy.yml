name: deploy

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build
      - run: nix develop -c sh -c 'cd backend && go test -race ./... && go run golang.org/x/vuln/cmd/govulncheck@latest ./...'
      - run: nix develop -c sh -c 'cd frontend && bun install --frozen-lockfile && bun audit'

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS -o /dev/null -F token=${{ secrets.GITLAB_TRIGGER_TOKEN }} -F ref=main -F "variables[SLF_REVISION]=${{ github.sha }}" https://gitlab.com/api/v4/projects/87242023/trigger/pipeline
