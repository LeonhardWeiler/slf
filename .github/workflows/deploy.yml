name: deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build
      - run: curl -fsS -o /dev/null -F token=${{ secrets.GITLAB_TRIGGER_TOKEN }} -F ref=main https://gitlab.com/api/v4/projects/87242023/trigger/pipeline
