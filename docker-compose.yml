# Stadt Land Fluss - backend + frontend in one container.
#
#   docker compose up -d      # pulls the image and starts the server
#   ->  http://localhost:8080
#
# The image is built by the GitLab CI after every commit on master and pushed
# to weilerleonhard/slf. Build locally instead of pulling:
#   docker compose up --build   (uncomment the 'build' line below for that)

services:
  slf:
    image: weilerleonhard/slf:latest
    # build: .
    ports:
      - "8080:8080"
    environment:
      # Enable logging to a file (leave empty = stdout only).
      LOG_FILE: /data/slf.log
    volumes:
      # Keep the log file persistent (SRS 12.9 / TODO G2).
      - slf-logs:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  slf-logs:
