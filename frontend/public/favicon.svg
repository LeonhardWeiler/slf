<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stadt Land Fluss">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="rounded"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- Himmel -->
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- Stadt: Skyline am Horizont -->
    <g fill="#1e293b">
      <rect x="9" y="23" width="8" height="19"/>
      <rect x="19" y="15" width="9" height="27"/>
      <rect x="30" y="26" width="7" height="16"/>
      <rect x="39" y="19" width="9" height="23"/>
      <rect x="50" y="28" width="6" height="14"/>
    </g>
    <!-- Fenster -->
    <g fill="#7dd3fc">
      <rect x="21.5" y="19" width="2" height="2"/>
      <rect x="24.5" y="19" width="2" height="2"/>
      <rect x="21.5" y="24" width="2" height="2"/>
      <rect x="24.5" y="24" width="2" height="2"/>
      <rect x="41.5" y="23" width="2" height="2"/>
      <rect x="44.5" y="23" width="2" height="2"/>
    </g>
    <!-- Land: grüner Hügel -->
    <path d="M0 40 Q 16 33 32 39 T 64 39 V64 H0 Z" fill="#22c55e"/>
    <!-- Fluss -->
    <path d="M-2 52 Q 16 45 32 52 T 66 52" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
