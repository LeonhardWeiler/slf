# CI/CD: checks backend + frontend and builds a Docker image after every
# master commit, which is pushed to weilerleonhard/slf.
#
# Expected CI/CD variables (Settings -> CI/CD -> Variables):
#   DOCKERHUB_USERNAME  - Docker Hub user (weilerleonhard)
#   DOCKERHUB_TOKEN     - Docker Hub access token (mark as "masked")

stages:
  - test
  - build

test:backend:
  stage: test
  image: golang:1.26-alpine
  script:
    - cd backend
    # gofmt gate: fails if files are not formatted.
    - test -z "$(gofmt -l .)" || { echo "gofmt diff in:"; gofmt -l .; exit 1; }
    - go vet ./...
    - go test ./...

test:frontend:
  stage: test
  image: oven/bun:1
  script:
    - cd frontend
    - bun install --frozen-lockfile
    - bun run lint # Biome linter
    - bun run test # Vitest (unit tests: rule mirror + Zod parsing)
    - bun run build # tsc -b && vite build -> typechecks and builds

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    # Only push on master (merge-request pipelines build nothing).
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - IMAGE="$DOCKERHUB_USERNAME/slf"
    - docker build -t "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:latest"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
