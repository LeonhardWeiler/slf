*{box-sizing:border-box}body{margin:0;color:var(--foreground,#29243e);font-family:var(--font-sans,system-ui);font-size:13px;line-height:1.55}nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}button{font:inherit;color:inherit;background:var(--secondary,#eeebf5);border:1px solid var(--border,#ddd7e8);padding:8px 12px;border-radius:10px;cursor:pointer}button[aria-pressed=true]{background:#7151df;border-color:#7151df;color:white}.example{background:var(--card,#f6f3fc);border:1px solid var(--border,#e0dbea);padding:22px;border-radius:16px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-foreground,#6e657e)}h2{margin:7px 0 10px;font-size:25px;letter-spacing:-.7px;line-height:1.15}.variants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:19px 0}.variant{border-radius:10px;padding:14px;background:var(--secondary,#ebe7f4);overflow-wrap:anywhere}.variant b{display:block;color:#8c71e9;font-size:11px;margin-bottom:5px}.question{font-size:12px;color:var(--muted-foreground,#71677c)}a{color:#8c71e9;text-underline-offset:3px}.start{display:inline-block;padding:10px 15px;color:white;background:#7151df;border-radius:9px;text-decoration:none;font-weight:650}.foot{font-size:11px;color:var(--muted-foreground,#71677c);margin:13px 0 0}@media(max-width:420px){.variants{grid-template-columns:1fr}.variant{padding:10px 12px}.example{padding:17px}h2{font-size:22px}}

const items=[{label:'Dein größter Spannungsabfall',title:'Aus Bewertung wird ein gemeinsamer Moment.',description:'Zwei getrennte Vergleiche: Wie werden Antworten enthüllt — und wie viel Arbeit bleibt beim Prüfen?',variants:['Kategorie für Kategorie','Alles auf einen Blick','Streitfälle zuerst'],question:'Wird die Bewertung spannender und leichter, ohne strittige Antworten zu übersehen?',scenario:'reviewflow'},{label:'Ein guter Einfall soll sich gut anfühlen',title:'Ein Wort landet. Das Spiel antwortet.',description:'Drei Intensitäten beim Feldabschluss. Die inhaltliche Bewertung bleibt ein eigener Schritt.',variants:['Leiser Haken','Kurzes Einfedern + Ton','Zusätzlich lokale Funken'],question:'Mehr Befriedigung — auch beim fünften Wort — bei gleich gutem Schreibfluss?',scenario:'answer'},{label:'Die zwölfte Runde soll keine Pflicht sein',title:'Ein nahes Finale schafft Vorfreude.',description:'Vergleiche die offene Buchstabenfolge mit einem kurzen Match und einer inhaltlichen Wahl.',variants:['Offene Buchstabenfolge','Fünf Runden mit Finale','Kurzes Match + Themenwahl'],question:'Beginnen Menschen freiwillig eine weitere Runde? Eine volle Fünferstrecke ist zusätzlich spielbar.',scenario:'next'},{label:'Solo zählt genauso',title:'Dein Können bekommt einen Spannungsbogen.',description:'Selbstbewertete Wörter, ein eigener Fortschritt und ein erreichbares Ziel. Keine fingierten Mitspieler.',variants:['Nur Punkte','Eigene Beispiel-Bestmarke','Kleine Wortmission'],question:'Welches Ziel motiviert, ohne sich nach zusätzlicher Pflicht anzufühlen?',scenario:'solo'}];function show(i){const x=items[i];document.querySelector('#label').textContent=x.label;document.querySelector('#title').textContent=x.title;document.querySelector('#description').textContent=x.description;document.querySelector('#question').textContent=x.question;document.querySelector('#variants').innerHTML=x.variants.map((v,j)=>'<div class="variant"><b>'+String.fromCharCode(65+j)+'</b>'+v+'</div>').join('');do
